<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Lost &amp; Found KU | Found Items</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-ku">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">KU | Campus Lost &amp; Found</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto gap-lg-2">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="lost.html">Lost Items</a></li>
          <li class="nav-item"><a class="nav-link active" href="found.html">Found Items</a></li>
          <li class="nav-item"><a class="nav-link" href="report.html">Report an Item</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container my-5">
    <div class="mb-4">
      <h1 class="h2 fw-bold" style="color: var(--ku-navy);">Found Items</h1>
      <p class="text-secondary mb-0">Browse sample reports and narrow results using the tools below.</p>
    </div>

    <!-- Search and Filter Controls -->
    <div class="row g-3 mb-4 align-items-center">
      <div class="col-md-6">
        <label for="searchInput" class="form-label visually-hidden">Search by item name or location</label>
        <input type="text" id="searchInput" class="form-control" placeholder="Search by item name or location...">
      </div>
      <div class="col-md-4">
        <label for="categoryFilter" class="form-label visually-hidden">Filter by category</label>
        <select id="categoryFilter" class="form-select">
          <option value="all" selected>All categories</option>
          <option value="Wallet">Wallet</option>
          <option value="ID Card">ID Card</option>
          <option value="Electronics">Electronics</option>
          <option value="Keys">Keys</option>
          <option value="Books">Books</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="col-md-2 d-grid">
        <button type="button" id="clearFiltersBtn" class="btn btn-ku-outline">Clear Filters</button>
      </div>
    </div>

    <!-- Empty State / Status Message -->
    <div id="emptyMessage" class="alert alert-secondary d-none" role="alert">
      No found items match your current search or category filter.
    </div>

    <!-- Cards Grid (3 cols desktop, 2 cols tablet, 1 col mobile) -->
    <div id="itemsContainer" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
  </main>

  <!-- Footer -->
  <footer class="py-3 mt-auto">
    <div class="container d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2">
      <span>Campus Lost &amp; Found KU — Kuwait University</span>
      <div class="d-flex gap-3">
        <a href="index.html" class="text-decoration-none text-secondary">Home</a>
        <a href="lost.html" class="text-decoration-none text-secondary">Lost</a>
        <a href="found.html" class="text-decoration-none text-secondary">Found</a>
        <a href="report.html" class="text-decoration-none text-secondary">Report</a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
